<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUXE NIGHT CLUB | Private Access</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:#050308;color:#fff;font-family:Poppins,sans-serif;overflow-x:hidden}
#intro{position:fixed;inset:0;z-index:9999;background:#000;display:flex;align-items:center;justify-content:center;transition:.8s}
#intro.hide{opacity:0;visibility:hidden;pointer-events:none}
#intro video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:0;background:radial-gradient(circle,rgba(255,0,170,.12),rgba(0,0,0,.82) 70%),linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.85))}
.intro-content{position:relative;z-index:2;text-align:center;padding:25px}
.intro-small{font-size:11px;letter-spacing:6px;color:#ff65d4;margin-bottom:10px}
.intro-title{font-family:"Bebas Neue";font-size:clamp(90px,20vw,220px);letter-spacing:10px;line-height:.8;text-shadow:0 0 10px rgba(255,0,200,.7),0 0 40px rgba(255,0,200,.45)}
.intro-sub{margin-top:20px;font-size:12px;letter-spacing:5px;color:#ddd}
.enter-btn{margin-top:35px;border:1px solid rgba(255,70,220,.8);background:rgba(255,0,180,.08);color:#fff;padding:16px 35px;border-radius:50px;font-weight:700;letter-spacing:2px;cursor:pointer;transition:.3s;box-shadow:0 0 20px rgba(255,0,200,.2),inset 0 0 20px rgba(255,0,200,.05)}
.enter-btn:hover{transform:translateY(-3px);background:#ff18c8;box-shadow:0 0 35px rgba(255,0,200,.55)}
.tap{margin-top:14px;font-size:10px;color:#888;letter-spacing:2px}
header{position:fixed;top:0;left:0;right:0;z-index:100;padding:22px 7%;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(rgba(5,3,8,.9),transparent)}
.logo{font-family:"Bebas Neue";font-size:30px;letter-spacing:4px;text-shadow:0 0 15px rgba(255,0,200,.7)}
.access{font-size:10px;letter-spacing:2px;color:#ff5bd3}
.hero{min-height:100vh;position:relative;display:flex;align-items:center;justify-content:center;text-align:center;padding:120px 20px 80px;overflow:hidden}
.hero:before{content:"";position:absolute;width:500px;height:500px;background:#d6009f;filter:blur(180px);opacity:.13;border-radius:50%}
.hero-content{position:relative;z-index:2;max-width:900px}
.badge{display:inline-block;padding:9px 18px;border:1px solid rgba(255,80,220,.4);border-radius:50px;color:#ff74da;font-size:10px;letter-spacing:3px;margin-bottom:25px;background:rgba(255,0,180,.05)}
h1{font-family:"Bebas Neue";font-size:clamp(90px,18vw,190px);letter-spacing:7px;line-height:.8;background:linear-gradient(#fff,#ff8be1 45%,#ff00bb);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 25px rgba(255,0,200,.3))}
.hero p{max-width:650px;margin:35px auto;color:#aaa;line-height:1.8;font-size:14px}
.buttons{display:flex;justify-content:center;gap:15px;flex-wrap:wrap}
.btn{display:inline-block;padding:15px 28px;border-radius:50px;text-decoration:none;color:#fff;font-size:11px;font-weight:700;letter-spacing:2px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.04);transition:.3s}
.btn.primary{background:linear-gradient(135deg,#ff00b7,#8b00ff);border:0;box-shadow:0 0 30px rgba(255,0,200,.25)}
.btn:hover{transform:translateY(-4px);box-shadow:0 0 30px rgba(255,0,200,.3)}
section{padding:100px 7%}
.section-title{text-align:center;margin-bottom:50px}
.section-title span{color:#ff5bd3;font-size:10px;letter-spacing:4px}
.section-title h2{font-family:"Bebas Neue";font-size:55px;letter-spacing:3px;margin-top:8px}
.servers{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;max-width:1150px;margin:auto}
.card{position:relative;overflow:hidden;padding:30px;min-height:270px;border:1px solid rgba(255,255,255,.08);border-radius:20px;background:linear-gradient(145deg,rgba(255,0,190,.08),rgba(255,255,255,.025));transition:.35s}
.card:before{content:"";position:absolute;width:130px;height:130px;right:-50px;top:-50px;background:#ff00b7;filter:blur(70px);opacity:.15}
.card:hover{transform:translateY(-8px);border-color:rgba(255,50,210,.45);box-shadow:0 15px 50px rgba(255,0,190,.12)}
.number{color:#ff5bd3;font-size:11px;letter-spacing:3px}
.card h3{font-family:"Bebas Neue";font-size:35px;letter-spacing:2px;margin:25px 0 12px}
.card p{color:#888;font-size:12px;line-height:1.7}
.card .play{display:inline-block;margin-top:25px;color:#fff;text-decoration:none;font-size:10px;letter-spacing:2px;font-weight:700}
.features{max-width:1000px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.feature{text-align:center;padding:35px 20px;border-top:1px solid rgba(255,0,190,.25)}
.icon{font-size:32px;margin-bottom:15px}
.feature h3{font-size:14px;margin-bottom:8px}
.feature p{color:#777;font-size:11px;line-height:1.7}
.quote{text-align:center;padding:130px 20px;position:relative}
.quote:before{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:400px;height:200px;background:#ff00b7;filter:blur(150px);opacity:.08}
.quote-text{position:relative;font-family:"Bebas Neue";font-size:clamp(35px,6vw,75px);letter-spacing:3px;max-width:1000px;margin:auto}
footer{padding:45px 20px;text-align:center;border-top:1px solid rgba(255,255,255,.06)}
footer strong{font-family:"Bebas Neue";font-size:25px;letter-spacing:3px}
footer p{margin-top:8px;color:#666;font-size:9px;letter-spacing:2px}
@media(max-width:800px){header{padding:18px 5%}.servers,.features{grid-template-columns:1fr}section{padding:80px 5%}.hero p{font-size:12px}.intro-title{font-size:100px}}
</style>
</head>
<body>

<div id="intro">
<video id="introVideo" autoplay muted playsinline preload="auto">
<source src="data:video/mp4;base64,
